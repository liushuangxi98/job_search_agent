<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>求职工作台</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#/jobs" class="brand"><span class="brand-mark">求</span><span>求职工作台<small>CAREER WORKSPACE</small></span></a>
    <div class="nav-label">准备与机会</div>
    <nav aria-label="工作台导航">
      <a href="#/resume" data-page="resume"><span>01</span>简历画像</a>
      <a href="#/knowledge" data-page="knowledge"><span>02</span>面试题库</a>
      <a href="#/jobs" data-page="jobs"><span>↗</span>岗位池</a>
    </nav>
    <div class="sidebar-note"><strong>下一站，从这里开始。</strong><p>整理自己的经历，<br>逐个了解感兴趣的机会。</p></div>
    <div class="connection" id="connection"><i></i><span>正在连接本机服务</span></div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div><div class="eyebrow" id="eyebrow">我的机会</div><h1 id="page-title">岗位池</h1></div>
      <div class="header-actions"><span class="badge" id="mode-badge">连接中</span><button type="button" id="active-activity" data-action="resume-activity" class="secondary" hidden>返回当前活动</button><button type="button" data-action="open-chat" class="secondary">聊一聊 ↗</button></div>
    </header>
    <div id="mode-banner" class="mode-banner" hidden><span><b>固定模拟样例</b> · 未调用模型，结果不评价实际资料。</span><label>联调场景 <select id="scenario"><option value="success">正常完成</option><option value="needs_input">需要补充</option><option value="partial">部分结果</option><option value="fail">服务失败</option></select></label></div>
    <div id="global-error" role="alert" class="error-banner" hidden></div>
    <section id="view" aria-label="当前主视图"><div class="loading">正在载入工作台…</div></section>
  </main>
  <button class="chat-fab" data-action="open-chat" aria-label="打开聊天">✦ <span>聊一聊</span></button>
  <aside id="chat-drawer" class="chat-drawer" hidden aria-label="全局聊天"></aside>
  <dialog id="editor" class="editor-dialog"></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <input id="file-picker" type="file" hidden>
</body>
</html>
